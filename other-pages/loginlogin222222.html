<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../static/img/gerbi.png">
    <title>ნოღოხაშის საჯარო სკოლა</title>
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/register.css">
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="auth-btn">Log In</button>
            
        </form>
    </div>

    <!-- Use type="module" and import firebase -->
    <script type="module" src="../static/js/login.js"></script>
    <script type="module" src="../static/js/firebase.js"></script>
    </body>
</html>
