<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ნოღოხაშის საჯარო სკოლა</title>
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/register.css">
</head>
<body>
    <div id="pageLoader" class="page-loader">
        <div class="loader-wrapper">

            <div class="loader-visual">
                <img src="../static/img/animation.gif" class="loader-gif" alt="loading">

                <div class="loader-circles">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <p class="loader-text">იტვირთება...</p>

        </div>
    </div>
    <div class="auth-container">
        <h2>Create an Account</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="auth-btn">Register</button>
            
            <p class="auth-switch">
                Already have an account? <a href="loginlogin222222.html">Log in</a>
            </p>
        </form>
    </div>
    
    <script type="module" src="../static/js/firebase.js"></script>
    <script type="module" src="../static/js/register.js"></script>
</body>
</html>
